<div class="tag-list-container" role="list">
  @for (tag of inheritedTags(); track tag) {
    <span class="tag-badge tag-badge--inherited" role="listitem" [matTooltip]="TOKENS.BROWSER.TRANSLATIONEDITOR.TAGS.INHERITEDTOOLTIP | transloco" matTooltipPosition="above">{{ tag }}</span>
  }
  @for (tag of tags(); track tag) {
    <span class="tag-badge" role="listitem">{{ tag }}</span>
  }
</div>
