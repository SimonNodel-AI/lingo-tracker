<!--
  Two layouts, one set of controls. `band` is the full-density strip; `inline` is
  the compact single line, which projects the row's content between the key chip
  and the right-hand rail. The key chip, rollup and action menu are declared once
  and shared, so the two densities can never drift apart on what a row can do.
-->
<div class="item-header" [class.item-header--inline]="layout() === 'inline'">
  <mat-icon
    class="translation-drag-handle"
    [class.translation-drag-handle--locked]="isReadOnly()"
    cdkDragHandle
    [matTooltip]="leadGlyphLabel() | transloco"
    [attr.aria-label]="leadGlyphLabel() | transloco"
    >{{ leadGlyph() }}</mat-icon
  >
  <button
    class="key-chip"
    type="button"
    (click)="onCopyKey()"
    (keydown.enter)="onCopyKey()"
    [matTooltip]="TOKENS.BROWSER.TRANSLATIONITEM.KEYTOOLTIPX | transloco : { key: fullKey() }"
    matTooltipClass="key-chip-tooltip"
    [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.COPYKEYARIALABELX | transloco : { key: fullKey() }"
  >
    <!-- The chip shows a shortened key; the untruncated key is on the tooltip and
         in the accessible name, so it is readable without copying it out. -->
    <span class="key-text"><span class="key-text__inner" [innerHTML]="fullKey() | keyMarkup : searchQuery()"></span></span>
    <mat-icon class="copy-icon">content_copy</mat-icon>
  </button>

  @if (layout() === 'inline') {
    <!-- The row's own content: identity and annotation zones. -->
    <ng-content />
  } @else {
    <div class="header-spacer"></div>

    @if (tags().length || inheritedTags().length) {
      <div class="header-tags">
        <app-tag-list [tags]="tags()" [inheritedTags]="inheritedTags()" />
      </div>
    }
  }

  <div class="header-actions">
    @if (layout() === 'inline' && hasComment()) {
      <!-- Compact has no room to swap the value out for the comment, and doing so
           put two unrelated data types in one slot. The comment is a marker that
           reveals itself on hover and focus instead. -->
      <button
        class="comment-marker"
        [class.comment-marker--match]="commentHasMatch()"
        type="button"
        [matTooltip]="comment() ?? ''"
        matTooltipClass="comment-marker-tooltip"
        [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.SHOWCOMMENTARIALABEL | transloco"
      >
        <mat-icon>comment</mat-icon>
        @if (commentHasMatch()) {
          <span class="match-badge"></span>
        }
      </button>
    }

    @if (localeStates().length) {
      <app-translation-rollup
        [locales]="localeStates()"
        [baseLocale]="baseLocale()"
        [compact]="layout() === 'inline'"
      />
    }

    @if (layout() === 'band' && !hideCommentButton()) {
      <button
        class="comment-button"
        [class.comment-button--active]="showComment()"
        [class.comment-button--match]="commentHasMatch()"
        mat-icon-button
        type="button"
        [disabled]="!comment()"
        (click)="onCommentClick($event)"
        [attr.aria-label]="(showComment() ? TOKENS.BROWSER.TRANSLATIONITEM.HIDECOMMENTARIALABEL : TOKENS.BROWSER.TRANSLATIONITEM.SHOWCOMMENTARIALABEL) | transloco"
      >
        <mat-icon>{{ commentIcon() }}</mat-icon>
        @if (commentHasMatch()) {
          <span class="match-badge"></span>
        }
      </button>
    }

    <button
      mat-icon-button
      type="button"
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.MOREACTIONSARIALABEL | transloco"
    >
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onEdit()" [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.EDITARIALABEL | transloco">
        <mat-icon>{{ editActionIcon() }}</mat-icon>
        <span>{{ editActionLabel() | transloco }}</span>
      </button>
      @if (translationEnabled()) {
        <!-- Auto-translate menu item: shows spinner while translating -->
        <button mat-menu-item (click)="onTranslate()" [disabled]="translateDisabled()" [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.TRANSLATEARIALABEL | transloco">
          @if (isTranslating()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <mat-icon>translate</mat-icon>
          }
          <span>{{ TOKENS.COMMON.ACTIONS.TRANSLATE | transloco }}</span>
        </button>
      }
      <button mat-menu-item (click)="onDelete()" [disabled]="isReadOnly()" [attr.aria-label]="TOKENS.BROWSER.TRANSLATIONITEM.DELETEARIALABEL | transloco">
        <mat-icon>delete</mat-icon>
        <span>{{ TOKENS.COMMON.ACTIONS.DELETE | transloco }}</span>
      </button>
    </mat-menu>
  </div>
</div>
