<div
  class="status-rail"
  role="group"
  [class.status-rail--filtering]="store.hasStatusFilter()"
  [attr.aria-label]="TOKENS.BROWSER.STATUSFILTER.GROUPARIALABEL | transloco"
>
  @for (item of toggles(); track item.id) {
    <button
      type="button"
      class="status-toggle"
      [attr.data-status]="item.id"
      [attr.data-testid]="'status-toggle-' + item.id"
      [attr.aria-pressed]="item.selected"
      [matTooltip]="item.id === 'needsWork' ? (TOKENS.BROWSER.STATUSFILTER.NEEDSWORKTOOLTIP | transloco) : ''"
      (click)="toggle(item)"
    >
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-name">{{ item.label | transloco }}</span>
      <span class="status-count">{{ item.count }}</span>
    </button>
  }
</div>
